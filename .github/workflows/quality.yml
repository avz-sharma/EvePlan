name: Quality gates

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_REQUIRED: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: python scripts/check.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-evidence
          path: |
            backend/coverage/
            frontend/coverage/
            frontend/test-results/
            .tools/quality/

  history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the scanner and scan all Git history
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts='--all' --redact

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eveplan:ci .
      - name: Verify non-root startup and healthcheck
        run: |
          docker run -d --name eveplan -p 8080:8080 eveplan:ci
          test "$(docker exec eveplan id -u)" = '10001'
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health && break
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/health
          docker image inspect eveplan:ci --format 'Image bytes: {{.Size}}'
      - name: Container logs
        if: always()
        run: docker logs eveplan
