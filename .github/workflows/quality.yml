name: Quality gates

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app/ tests/
      - run: mypy --strict app/
      - run: bandit -r app/ --exclude app/static -s B101
      - run: pytest --cov=app --cov-report=json:coverage.json --cov-report=xml --cov-fail-under=70
      - run: coverage report --include='app/engine/*' --fail-under=80
      - run: pip-audit --disable-pip --require-hashes -r requirements-dev.lock
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.*

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check:unused
      - run: pnpm run test:coverage
      - run: pnpm run build
      - run: pnpm audit
      - run: python -m pip install --require-hashes -r ../backend/requirements.lock
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the degraded-mode API
        run: |
          python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8018 > ../backend-smoke.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8018/health && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8018/health
      - run: pnpm run test:smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-evidence
          path: |
            frontend/coverage/
            frontend/test-results/
            backend-smoke.log

  history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the scanner and scan all Git history
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts='--all' --redact

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eveplan:ci .
      - name: Verify non-root startup and healthcheck
        run: |
          docker run -d --name eveplan -p 8080:8080 eveplan:ci
          test "$(docker exec eveplan id -u)" = '10001'
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health && break
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/health
          docker image inspect eveplan:ci --format 'Image bytes: {{.Size}}'
      - name: Container logs
        if: always()
        run: docker logs eveplan
