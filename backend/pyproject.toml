[project]
name = "celebration-planner-backend"
version = "0.1.0"
description = "Deterministic Planning Engine and API for Multi-Generational Indian Family Wedding Planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0,<0.140",
    "uvicorn>=0.51.0,<0.52",
    "pydantic>=2.12.4,<3",
    "pydantic-settings>=2.12.0,<3",
    "pypdf>=6.14.2,<7",
    "httpx>=0.28.1,<0.29",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.32,<0.1",
    "google-genai>=2.8.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
